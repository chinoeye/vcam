name: Build VCam

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make git curl xz-utils clang lld llvm file build-essential \
            libssl-dev libplist-dev zlib1g-dev libtinfo6 || true

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos.git

      - name: Install iOS SDK
        run: |
          set -e
          mkdir -p "$THEOS/sdks"
          if ls "$THEOS/sdks"/*.sdk >/dev/null 2>&1; then
            echo "SDK 已存在"
            ls -d "$THEOS/sdks/"*.sdk
            exit 0
          fi
          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git sdks-repo
          cd sdks-repo
          git sparse-checkout set iPhoneOS15.0.sdk
          cp -r iPhoneOS15.0.sdk "$THEOS/sdks/"
          ls -d "$THEOS/sdks/"*.sdk

      - name: Show toolchain
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS"
          echo "--- SDK ---"
          ls "$THEOS/sdks" || true
          echo "--- clang ---"
          clang --version | head -1
          echo "--- ldid ---"
          which ldid || ls "$THEOS/bin" || true

      - name: Inspect source
        working-directory: VCam-upload
        run: |
          echo "=== 当前目录 ==="
          pwd
          echo "=== 文件清单 ==="
          find . -maxdepth 2 -type f | sort
          echo "=== Makefile 内容 ==="
          cat Makefile

      - name: Clean
        working-directory: VCam-upload
        run: make clean || true

      - name: Build package
        working-directory: VCam-upload
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 DEBUG=0 2>&1 | tee /tmp/build.log | tail -300

      - name: List artifacts
        run: |
          echo "--- packages 目录 ---"
          ls -lh VCam-upload/packages/ 2>/dev/null || echo "packages 目录不存在"
          echo "--- 全仓库找 deb/dylib ---"
          find VCam-upload -type f \( -name '*.deb' -o -name '*.dylib' \) 2>/dev/null || true
          echo "--- .theos 构建目录 ---"
          find VCam-upload/.theos -maxdepth 2 2>/dev/null | head -30 || echo "无 .theos"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: VCam-deb
          path: VCam-upload/packages/*.deb
          if-no-files-found: error
          retention-days: 30
