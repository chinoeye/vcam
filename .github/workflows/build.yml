name: Build VCam

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make git curl xz-utils clang lld llvm file build-essential \
            libssl-dev libplist-dev zlib1g-dev libtinfo6 || true

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos.git

      - name: Install iOS SDK
        run: |
          set -e
          mkdir -p "$THEOS/sdks"
          echo "--- 当前 sdks 目录 ---"
          ls -la "$THEOS/sdks" || true

          if ls "$THEOS/sdks"/*.sdk >/dev/null 2>&1; then
            echo "SDK 已存在，跳过下载"
            ls -d "$THEOS/sdks/"*.sdk
            exit 0
          fi

          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git sdks-repo
          cd sdks-repo
          git sparse-checkout set iPhoneOS15.0.sdk
          cp -r iPhoneOS15.0.sdk "$THEOS/sdks/"
          ls -d "$THEOS/sdks/"*.sdk

      - name: Show toolchain
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS"
          echo "--- SDK ---"
          ls "$THEOS/sdks" || true
          echo "--- clang ---"
          clang --version | head -1
          echo "--- ldid ---"
          which ldid || ls "$THEOS/bin" || true

      - name: Clean
        working-directory: VCam-upload
        run: make clean || true

      - name: Build package
        working-directory: VCam-upload
        run: make package FINALPACKAGE=1 DEBUG=0 2>&1 | tail -300

      - name: List artifacts
        run: ls -lh VCam-upload/packages/ || true

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: VCam-deb
          path: VCam-upload/packages/*.deb
          if-no-files-found: error
          retention-days: 30
