name: Build VCam

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos.git

      - name: Show toolchain
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clean
        working-directory: VCam-upload
        run: make clean || true

      - name: Build package
        working-directory: VCam-upload
        run: make package FINALPACKAGE=1 DEBUG=0

      - name: List artifacts
        run: ls -lh VCam-upload/packages/ || true

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: VCam-deb
          path: VCam-upload/packages/*.deb
          if-no-files-found: error
          retention-days: 30
