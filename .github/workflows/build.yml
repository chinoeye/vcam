name: Build VCam

# 把 ios/ 目录整个作为仓库根上传后即可用。
# 触发：push / 手动 workflow_dispatch / 打 tag
#
# 产物在 Artifacts 里，是一个 .deb，直接 scp 到手机 dpkg -i 安装。

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

# 用 API 逐文件上传会产生多个 commit，也就是多次 push 触发。
# 只保留最后一次运行，前面排队/进行中的全部取消，避免白等一轮。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos.git

      - name: Show toolchain
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clean
        run: make clean || true

      - name: Build package
        run: make package FINALPACKAGE=1 DEBUG=0

      - name: List artifacts
        run: ls -lh packages/ || true

      # TrollFools 注入要的是裸 dylib，不是 deb。
      # 这里直接把 .theos 里的 arm64 产物捞出来单独出一个 artifact，
      # 省掉「下载 deb → 解包 → 找 dylib」这三步。
      - name: Collect raw dylib
        shell: bash
        run: |
          set -e
          mkdir -p out
          # 优先取 arm64 的最终产物（debug 目录里的旧副本不要）
          while IFS= read -r f; do
            cp -v "$f" "out/$(basename "$f")"
          done < <(find .theos -type f -name "*.dylib" -path "*arm64*" 2>/dev/null || true)

          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "arm64 目录没找到，退回全量搜索"
            while IFS= read -r f; do
              cp -v "$f" "out/$(basename "$f")"
            done < <(find .theos -type f -name "*.dylib" 2>/dev/null || true)
          fi

          echo "--- out ---"
          ls -lh out/ || true
          test -n "$(ls -A out 2>/dev/null)" || { echo "没有找到 dylib"; exit 1; }

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: VCam-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: VCam-dylib
          path: out/*.dylib
          if-no-files-found: error
          retention-days: 30
